<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Todo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lexend">
  <style type="text/tailwindcss">
    @theme {
      --color-brand-primary: #5555FF;
    }
  </style>
</head>

<body class="h-[100dvh]">
  <header class="sticky top-0 bg-[#FFF] shadow-md p-2 flex justify-between items-center">
    <div style="display: flex;">
      <!--<img src="./public/medusa.png" alt="Medusa Logo" loading="lazy" width="30"/>--> &nbsp;
      <h1 class="text-3xl font-bold">Medusa</h1>
    </div>
    
    <div>
      <!-- lucide does not have 3rd party icons, so i had to get the svg with the help of AI :) -->
      <a href="https://github.com/Temi-Tade/Medusa">
        <svg 
          xmlns="http://w3.org" 
          width="24" 
          height="24" 
          viewBox="0 0 24 24" 
          fill="#333" 
          stroke="#333" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
        >
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
          <path d="M9 18c-4.51 2-5-2-7-2" />
        </svg>
      </a>
    </div>
  </header>
  
  <div class="p-3 h-[100%] grid place-items-center">
    <div class="p-2 w-full">
      <div id="mode_picker" class="p-3 my-2 flex justify-center items-center mb-8">
        <label for="enc_file_mode" class="block">
          <input type="radio" id="enc_file_mode" value="encryption" name="file_mode" class="hidden" checked>
          <span class="inline-flex p-3 rounded-md text-[16px]">Encrypt &nbsp;<i i
          data-lucide="lock" width="16"></i></span>
        </label>
        
        <label for="dec_file_mode" class="block">
          <input type="radio" id="dec_file_mode" value="encryption" name="file_mode" class="hidden">
          <span class="inline-flex p-3 rounded-md text-[16px]">Decrypt &nbsp;<i data-lucide="unlock" width="16"></i></span>
        </label>
      </div>
      
      <label id="file_label" for="file">
        <input class="hidden" type="file" name="file" id="file">
        <span class="p-3 m-auto rounded-md text-[#FFF] w-[fit-content] block bg-brand-primary">Select a File</span>
      </label>
      
      <div id="file_details" class="hidden">
        <div id="file_preview">
          <h3>File Preview</h3>
        </div>
      </div>
    </div>
    
    <div id="pwd_wrap" class="grid place-items-center w-full hidden">
      <h3>Encrpyt File</h3>
      <div class="p-2 w-full">
        <p id="enc_msg" class="mb-2 text-center text-sm italic">Remember your password, you will need it to decrypt the file.</p>
        <label for="password" class="block relative">
          <input 
            class="p-2 rounded-sm w-full border-1"
            type="password"
            id="password"
            placeholder="Enter a password..."
          />
            <button id="toggler" class="absolute top-2 right-2">
              <i id="eye" data-lucide="eye" width="16"></i>
              <i id="lock" class="hidden" data-lucide="eye-off" width="16"></i>
            </button>
        </label>
      </div>
      
      <div class="p-2">
        <button id="encrypt_btn" disabled>Encrypt File</button>
      </div>
    </div>
    
    <!--<div id="output" class="hidden grid place-items-center">
      <div>
        <span>Original:</span>
        <textarea id="raw" rows="8" cols="40"></textarea>
      </div>
      
      <div>
        <span>Encrypted:</span>
        <textarea id="encoded" rows="8" cols="40"></textarea>
      </div>
      
      <div>
        <span>Decrypted:</span>
        <textarea id="decoded" rows="8" cols="40"></textarea>
      </div>
    </div>-->
    
    <div id="save_btn_wrap" class="hidden">
      <p class="text-md italic text-center" id="save_message"></p>
      <button class="m-auto my-2" id="save_btn">Save file</button>
    </div>
  </div>
  
  <div id="modalbg" class="hidden fixed inset-0 bg-[#CCCC] backdrop-blur-sm grid place-items-center">
    <div id="modal" class="w-[80%] bg-[#FFF] p-2 rounded-sm"></div>
  </div>
  
  <script src="main.js" type="module"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
